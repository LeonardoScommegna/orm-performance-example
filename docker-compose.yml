version: '2'
services:
  db:
    image: mysql:latest
    environment:
      MYSQL_DATABASE: mysql_db
      MYSQL_USER: mysql_user 
      MYSQL_PASSWORD: pwd
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - my-datavolume:/var/lib/mysql

volumes:
  my-datavolume:
